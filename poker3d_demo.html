<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Démo Poker 3D — Ambiance Casino Underground (Prominence Poker)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <!-- CDN Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060608;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    /* Conteneur 3D Plein Écran */
    #poker3dContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD HTML/CSS Superposé (Non bloquant pour le WebGL grâce à pointer-events: none) */
    .poker-hud-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
    }

    .hud-interactive {
      pointer-events: auto;
    }

    /* Curseur de mise doré */
    .poker-range-slider {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }
    .poker-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fbbf24;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
    }
  </style>
</head>
<body class="relative w-full h-full">

  <!-- 1. CONTENEUR CANVAS THREE.JS (SCÈNE 3D) -->
  <div id="poker3dContainer"></div>

  <!-- 2. INTERFACE UTILISATEUR HUD (SUPERPOSÉE EN PUR HTML/CSS VIA Z-INDEX) -->
  <div class="poker-hud-overlay">
    
    <!-- HAUT DE L'ÉCRAN : POT, TOUR & STATUT DE TABLE -->
    <div class="flex items-center justify-between w-full max-w-4xl mx-auto gap-2">
      <div class="hud-interactive flex items-center gap-2 bg-black/85 border border-white/10 px-3.5 py-1.5 rounded-full shadow-2xl backdrop-blur-md">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs font-black tracking-wide text-white uppercase hidden sm:inline">Table VIP • Underground</span>
        <span class="text-xs font-black tracking-wide text-emerald-400 sm:hidden">3D VIP</span>
      </div>

      <!-- Pot au centre -->
      <div class="hud-interactive flex items-center gap-3 bg-black/90 border border-amber-500/40 px-5 py-2 rounded-full shadow-2xl backdrop-blur-md">
        <div class="flex items-center gap-2">
          <span class="text-lg">🪙</span>
          <div>
            <div class="text-[9px] uppercase tracking-widest text-stone-400 font-bold">POT AU CENTRE</div>
            <div class="font-mono text-base font-black text-amber-300">14 850 €</div>
          </div>
        </div>
        <div class="border-l border-white/15 pl-3">
          <div class="text-[9px] uppercase tracking-widest text-stone-400 font-bold">TOUR</div>
          <div class="text-xs font-extrabold text-emerald-400">À toi (1:45)</div>
        </div>
      </div>

      <!-- Commandes de test -->
      <div class="hud-interactive flex items-center gap-1.5">
        <a href="Les_Flambeurs.html" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/15 border border-white/20 text-white text-xs font-bold transition">
          ← Casino
        </a>
      </div>
    </div>

    <!-- BAS DE L'ÉCRAN : COMMANDES DE JEU (FIXÉES ET ACCESSIBLES AU POUCE SUR MOBILE) -->
    <div class="w-full max-w-lg mx-auto space-y-2.5 pb-2">
      
      <!-- Bandeau Curseur & Montant de Relance -->
      <div class="hud-interactive bg-black/85 border border-white/15 rounded-2xl p-3 shadow-2xl backdrop-blur-md space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="text-stone-300 font-bold">Montant de relance :</span>
          <span id="demoRaiseDisplay" class="font-mono text-sm font-black text-amber-300">250 €</span>
        </div>
        <input id="demoRaiseSlider" type="range" min="100" max="10000" step="50" value="250" class="poker-range-slider w-full" oninput="document.getElementById('demoRaiseDisplay').textContent = this.value + ' €'; document.getElementById('btnRaiseAmount').textContent = this.value + ' €';">
        <div class="flex items-center justify-between gap-1 text-[10px] font-bold text-amber-200">
          <button onclick="setRaise(100)" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10">Min (100)</button>
          <button onclick="setRaise(500)" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10">500 €</button>
          <button onclick="setRaise(1000)" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10">1 000 €</button>
          <button onclick="setRaise(5000)" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10">5 000 €</button>
          <button onclick="setRaise(10000)" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-400/40">Tapis</button>
        </div>
      </div>

      <!-- Les 3 Grands Boutons Tactiles (Passer, Suivre, Relancer) -->
      <div class="hud-interactive grid grid-cols-3 gap-2">
        <!-- SE COUCHER -->
        <button class="py-3.5 rounded-2xl bg-gradient-to-b from-stone-800 to-stone-900 border border-rose-500/40 hover:border-rose-400 active:scale-95 transition shadow-lg flex flex-col items-center justify-center">
          <span class="text-xs font-black text-white tracking-wide">PASSER</span>
          <span class="text-[10px] font-bold text-rose-400">SE COUCHER</span>
        </button>

        <!-- PAROLE / SUIVRE -->
        <button class="py-3.5 rounded-2xl bg-gradient-to-b from-sky-700 to-sky-900 border border-sky-400/50 hover:brightness-110 active:scale-95 transition shadow-lg flex flex-col items-center justify-center">
          <span class="text-xs font-black text-white tracking-wide">PAROLE /</span>
          <span class="text-[10px] font-bold text-cyan-200">SUIVRE (100 €)</span>
        </button>

        <!-- RELANCER -->
        <button class="py-3.5 rounded-2xl bg-gradient-to-b from-amber-400 to-amber-600 hover:brightness-110 text-black active:scale-95 transition shadow-lg flex flex-col items-center justify-center font-black">
          <span class="text-xs font-black tracking-wide">RELANCER</span>
          <span id="btnRaiseAmount" class="text-[10px] font-mono font-extrabold text-amber-950">250 €</span>
        </button>
      </div>

    </div>

  </div>

  <!-- 3. CODE COMPLET POKER 3D (EMBARQUÉ DIRECTEMENT POUR GARANTIR L'OUVERTURE EN DOUBLE-CLIC OU SERVEUR) -->
  <script>
    function setRaise(val) {
      document.getElementById('demoRaiseSlider').value = val;
      document.getElementById('demoRaiseDisplay').textContent = val + ' €';
      document.getElementById('btnRaiseAmount').textContent = val + ' €';
    }

    class Poker3DExperience {
      constructor(containerElement, options = {}) {
        this.container = typeof containerElement === 'string' 
          ? document.getElementById(containerElement) 
          : containerElement;

        if (!this.container) return;

        this.options = Object.assign({
          feltColor: 0x0f4229,     // Vert feutre sombre casino underground
          railColor: 0x121013,     // Cuir noir / bordeaux très sombre
          woodColor: 0x1e1108,     // Bois acajou foncé
          tableWidth: 6.4,         // Longueur de la table ovale
          tableDepth: 3.2,         // Largeur de la table ovale
        }, options);

        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.spotLight = null;
        this.animationFrameId = null;
        this.tableGroup = null;

        this.cards = { hero: [], community: [], opponents: [] };
        this.chipStacks = [];

        this.init();
      }

      init() {
        if (typeof THREE === 'undefined') {
          console.error('[Poker3D] Three.js n\'est pas chargé.');
          return;
        }

        this.setupScene();
        this.setupCamera();
        this.setupRenderer();
        this.setupLighting();
        this.buildPokerTable();
        this.buildPlaceholders();
        this.setupEventListeners();
        this.handleResize();
        this.startRenderLoop();
      }

      setupScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x060608);
        this.scene.fog = new THREE.FogExp2(0x060608, 0.045);
      }

      setupCamera() {
        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;
        const aspect = width / height;
        this.camera = new THREE.PerspectiveCamera(46, aspect, 0.1, 50);
        this.updateCameraForDevice(width, height);
      }

      setupRenderer() {
        this.renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: 'high-performance',
          alpha: false
        });

        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;

        this.renderer.setSize(width, height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.15;

        this.renderer.domElement.id = 'poker3dCanvas';
        this.renderer.domElement.style.position = 'absolute';
        this.renderer.domElement.style.top = '0';
        this.renderer.domElement.style.left = '0';
        this.renderer.domElement.style.width = '100%';
        this.renderer.domElement.style.height = '100%';
        this.renderer.domElement.style.zIndex = '1';
        this.renderer.domElement.style.pointerEvents = 'none';

        this.container.style.position = 'relative';
        this.container.appendChild(this.renderer.domElement);
      }

      setupLighting() {
        const ambientLight = new THREE.AmbientLight(0x12141c, 0.35);
        this.scene.add(ambientLight);

        this.spotLight = new THREE.SpotLight(0xfff1d6, 3.8);
        this.spotLight.position.set(0, 6.5, 0.2);
        this.spotLight.angle = Math.PI / 4.2;
        this.spotLight.penumbra = 0.55;
        this.spotLight.decay = 1.4;
        this.spotLight.distance = 18;

        this.spotLight.castShadow = true;
        this.spotLight.shadow.mapSize.width = 1024;
        this.spotLight.shadow.mapSize.height = 1024;
        this.spotLight.shadow.camera.near = 1;
        this.spotLight.shadow.camera.far = 12;
        this.spotLight.shadow.bias = -0.00015;

        this.scene.add(this.spotLight);
        this.scene.add(this.spotLight.target);
        this.spotLight.target.position.set(0, 0, 0);

        const rimLight = new THREE.DirectionalLight(0x3a4b68, 0.45);
        rimLight.position.set(0, 3, -6);
        this.scene.add(rimLight);

        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.95 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.8;
        floor.receiveShadow = true;
        this.scene.add(floor);
      }

      buildPokerTable() {
        this.tableGroup = new THREE.Group();

        const w = this.options.tableWidth;
        const d = this.options.tableDepth;
        const r = d / 2;
        const straightLen = w - d;

        const ovalShape = new THREE.Shape();
        ovalShape.moveTo(-straightLen / 2, r);
        ovalShape.lineTo(straightLen / 2, r);
        ovalShape.absarc(straightLen / 2, 0, r, Math.PI / 2, -Math.PI / 2, true);
        ovalShape.lineTo(-straightLen / 2, -r);
        ovalShape.absarc(-straightLen / 2, 0, r, -Math.PI / 2, Math.PI / 2, true);

        const feltTexture = this.generateFeltTexture();
        const feltMat = new THREE.MeshStandardMaterial({
          color: this.options.feltColor,
          map: feltTexture,
          roughness: 0.88,
          metalness: 0.05
        });

        const feltMesh = new THREE.Mesh(new THREE.ShapeGeometry(ovalShape, 48), feltMat);
        feltMesh.rotation.x = -Math.PI / 2;
        feltMesh.receiveShadow = true;
        this.tableGroup.add(feltMesh);

        const ringShape = new THREE.Shape();
        const rw = w * 0.72, rd = d * 0.68, rr = rd / 2, rsl = rw - rd;
        ringShape.moveTo(-rsl / 2, rr);
        ringShape.lineTo(rsl / 2, rr);
        ringShape.absarc(rsl / 2, 0, rr, Math.PI / 2, -Math.PI / 2, true);
        ringShape.lineTo(-rsl / 2, -rr);
        ringShape.absarc(-rsl / 2, 0, rr, -Math.PI / 2, Math.PI / 2, true);

        const ringLine = new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(ringShape.getPoints(64)),
          new THREE.LineBasicMaterial({ color: 0xefd188, transparent: true, opacity: 0.35 })
        );
        ringLine.rotation.x = -Math.PI / 2;
        ringLine.position.y = 0.002;
        this.tableGroup.add(ringLine);

        const railOuterShape = new THREE.Shape();
        const railThickness = 0.35, roR = r + railThickness;
        railOuterShape.moveTo(-straightLen / 2, roR);
        railOuterShape.lineTo(straightLen / 2, roR);
        railOuterShape.absarc(straightLen / 2, 0, roR, Math.PI / 2, -Math.PI / 2, true);
        railOuterShape.lineTo(-straightLen / 2, -roR);
        railOuterShape.absarc(-straightLen / 2, 0, roR, -Math.PI / 2, Math.PI / 2, true);

        const railHole = new THREE.Path();
        railHole.moveTo(-straightLen / 2, r);
        railHole.lineTo(straightLen / 2, r);
        railHole.absarc(straightLen / 2, 0, r, Math.PI / 2, -Math.PI / 2, true);
        railHole.lineTo(-straightLen / 2, -r);
        railHole.absarc(-straightLen / 2, 0, r, -Math.PI / 2, Math.PI / 2, true);
        railOuterShape.holes.push(railHole);

        const railMesh = new THREE.Mesh(
          new THREE.ExtrudeGeometry(railOuterShape, { depth: 0.14, bevelEnabled: true, bevelSegments: 4, bevelSize: 0.08, bevelThickness: 0.08 }),
          new THREE.MeshStandardMaterial({ color: this.options.railColor, roughness: 0.32, metalness: 0.15 })
        );
        railMesh.rotation.x = -Math.PI / 2;
        railMesh.position.y = -0.04;
        railMesh.castShadow = true;
        railMesh.receiveShadow = true;
        this.tableGroup.add(railMesh);

        const legGeo = new THREE.CylinderGeometry(0.35, 0.45, 1.6, 24);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x110b06, roughness: 0.7 });
        const leg1 = new THREE.Mesh(legGeo, legMat);
        leg1.position.set(-1.4, -0.9, 0);
        leg1.castShadow = true;
        this.tableGroup.add(leg1);

        const leg2 = new THREE.Mesh(legGeo, legMat);
        leg2.position.set(1.4, -0.9, 0);
        leg2.castShadow = true;
        this.tableGroup.add(leg2);

        this.scene.add(this.tableGroup);
      }

      generateFeltTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0f3823';
        ctx.fillRect(0, 0, 512, 512);

        const imgData = ctx.getImageData(0, 0, 512, 512);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const noise = (Math.random() - 0.5) * 16;
          d[i] = Math.min(255, Math.max(0, d[i] + noise));
          d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + noise));
          d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + noise));
        }
        ctx.putImageData(imgData, 0, 0);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(6, 6);
        return texture;
      }

      buildPlaceholders() {
        const cardGeo = new THREE.BoxGeometry(0.48, 0.004, 0.70);
        const cardMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35 });

        for (let i = 0; i < 5; i++) {
          const card = new THREE.Mesh(cardGeo, cardMat);
          card.position.set(-1.1 + i * 0.55, 0.005, -0.05);
          card.castShadow = true;
          card.receiveShadow = true;
          this.scene.add(card);
          this.cards.community.push(card);
        }

        const heroCard1 = new THREE.Mesh(cardGeo, cardMat);
        heroCard1.position.set(-0.24, 0.008, 1.05);
        heroCard1.rotation.y = 0.12;
        heroCard1.castShadow = true;
        this.scene.add(heroCard1);
        this.cards.hero.push(heroCard1);

        const heroCard2 = new THREE.Mesh(cardGeo, cardMat);
        heroCard2.position.set(0.24, 0.012, 1.05);
        heroCard2.rotation.y = -0.08;
        heroCard2.castShadow = true;
        this.scene.add(heroCard2);
        this.cards.hero.push(heroCard2);

        this.createChipStack(-0.9, 0.8, 12, 0xd97706);
        this.createChipStack(0.9, 0.8, 15, 0x10b981);
        this.createChipStack(0.0, -0.65, 20, 0xf59e0b);
      }

      createChipStack(x, z, count = 10, colorHex = 0xd97706) {
        const chipGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.038, 28);
        const chipMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.2 });
        const stack = new THREE.Group();
        stack.position.set(x, 0, z);

        for (let i = 0; i < count; i++) {
          const chip = new THREE.Mesh(chipGeo, chipMat);
          chip.position.set((Math.random() - 0.5) * 0.006, 0.02 + i * 0.039, (Math.random() - 0.5) * 0.006);
          chip.rotation.y = Math.random() * Math.PI;
          chip.castShadow = true;
          chip.receiveShadow = true;
          stack.add(chip);
        }

        this.scene.add(stack);
        this.chipStacks.push(stack);
        return stack;
      }

      updateCameraForDevice(width, height) {
        if (!this.camera) return;

        const isPortrait = height > width;
        this.camera.aspect = width / height;

        if (isPortrait) {
          // Portrait (Smartphone) : Recul caméra + FOV élargi
          this.camera.fov = 68;
          this.camera.position.set(0, 4.8, 4.4);
          this.camera.lookAt(0, 0.1, 0.2);
        } else {
          // Paysage (PC / Écrans larges) : Première personne
          this.camera.fov = 46;
          this.camera.position.set(0, 3.1, 3.4);
          this.camera.lookAt(0, 0.25, 0.15);
        }

        this.camera.updateProjectionMatrix();
      }

      handleResize() {
        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;

        this.updateCameraForDevice(width, height);
        if (this.renderer) {
          this.renderer.setSize(width, height);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
      }

      setupEventListeners() {
        window.addEventListener('resize', () => this.handleResize(), { passive: true });
        window.addEventListener('orientationchange', () => {
          setTimeout(() => this.handleResize(), 150);
        }, { passive: true });
      }

      startRenderLoop() {
        const animate = () => {
          this.animationFrameId = requestAnimationFrame(animate);

          const time = performance.now() * 0.001;
          if (this.spotLight) {
            this.spotLight.intensity = 3.8 + Math.sin(time * 1.5) * 0.08;
          }

          this.renderer.render(this.scene, this.camera);
        };

        animate();
      }
    }

    // Instanciation de la scène 3D
    window.addEventListener('DOMContentLoaded', () => {
      new Poker3DExperience('poker3dContainer');
    });
  </script>
</body>
</html>
